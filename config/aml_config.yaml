database:
  host: 127.0.0.1
  port: 5433
  name: aml_db
  user: postgres
  password: password

embedding:
  model_name: BAAI/bge-m3
  dimension: 1024
  batch_size: 32        # bge-m3 daha agir — batch_size kucultuldu

retrieval:
  pg_trgm_top_k: 20
  full_text_top_k: 20
  pgvector_top_k: 20
  merged_top_k: 30
  reranker_top_k: 10
  min_trgm_score: 0.25
  min_vector_score: 0.50
  reranker_prefilter_score: 0.60   # candidates below this score skip the reranker

reranker:
  enabled: true
  model_name: BAAI/bge-reranker-v2-m3
  model_version: v1
  batch_size: 32
  use_cache: true
  device: auto   # "auto" = GPU if available, else CPU. Override with "cuda" or "cpu".

scoring:
  scoring_config_version: scoring_v2_reranker
  threshold_config_version: threshold_v2_reranker
