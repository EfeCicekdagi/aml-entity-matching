database:
  host: 127.0.0.1
  port: 5433
  name: aml_db
  user: postgres
  password: password
embedding:
  model_name: intfloat/multilingual-e5-large
  dimension: 1024
  batch_size: 32
  device: auto
retrieval:
  pg_trgm_top_k: 20
  full_text_top_k: 20
  pgvector_top_k: 20
  merged_top_k: 30
  reranker_top_k: 10
  min_trgm_score: 0.25
  min_vector_score: 0.45
  reranker_prefilter_score: 0.40
ner:
  enabled: true
  model_name: savasy/bert-base-turkish-ner-cased
  device: auto
reranker:
  enabled: true
  model_name: BAAI/bge-reranker-v2-m3
  model_version: v1
  batch_size: 32
  use_cache: true
  device: auto
scoring:
  scoring_config_version: scoring_v2_reranker
  threshold_config_version: threshold_v3_bge_m3
